# Déploiement Render de ShuyahStore (New > Blueprint > ce dépôt).
# Les variables marquées « sync: false » sont des SECRETS : Render les demande au premier déploiement et les garde chiffrées
# (jamais de secret dans ce fichier ni dans le dépôt).
services:
  # --------------------------------------------------------------------------
  # API FastAPI : comptes, dépôt et vérification des APK, catalogue, téléchargements
  # --------------------------------------------------------------------------
  - type: web
    name: shuyahstore-api
    # Nom de domaine de l'API (à relier chez le registraire par l'enregistrement DNS que Render indique)
    domains:
      - api.shuyahstore.store
    runtime: python
    plan: starter            # payant : le service ne s'endort pas (un téléchargement ne doit pas attendre 50 s)
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # --- SECRETS (à saisir par le propriétaire dans le tableau de bord Render) ---
      - key: MONGO_URL          # chaîne Atlas mongodb+srv://… (les APK sont stockés dans cette base)
        sync: false
      - key: ADMIN_EMAIL        # compte administrateur, créé au démarrage
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET         # généré par Render
        generateValue: true
      # --- Valeurs non secrètes ---
      - key: MONGO_DB_NAME
        value: shuyahstore
      # Adresse(s) du site, séparées par des virgules (CORS et cookie de session) : nom de domaine définitif (19/11/2026), sans les anciennes adresses onrender.com.
      # Les clés d'accès (WebAuthn) sont liées à ce domaine : celles créées sur l'ancienne adresse sont à recréer.
      - key: FRONTEND_ORIGIN
        value: https://shuyahstore.store
      - key: PUBLIC_SITE_URL
        value: https://shuyahstore.store
      - key: WEBAUTHN_RP_ID
        value: shuyahstore.store
      # --- Envoi des e-mails de vérification (SMTP). Facultatif : sans SMTP_HOST, la vérification n'est pas proposée et rien n'est bloqué. ---
      # --- WhatsApp par Liluvine (SAWALI) : code de connexion (OTP) et rapports PDF. Facultatif : sans ces deux valeurs, rien n'est bloqué. ---
      # Créer d'abord l'émetteur « shuyahstore » dans SAWALI, qui fournit l'adresse du service et la clé HMAC.
      - key: CNIB_CLE            # SECRET (lot 25) : clé DÉDIÉE au chiffrement des CNIB (16 caractères minimum, ≠ JWT_SECRET) ; à générer puis à ne jamais perdre
        sync: false
      - key: ANTHROPIC_API_KEY   # SECRET (lot 24) : lecture automatique de la CNIB à l'inscription ; sans clé, toute CNIB passe en revue humaine
        sync: false
      - key: LILUVINE_WA_URL    # ex. https://api.sawalismartsystems.com/api/webhook/liluvine-send
        sync: false
      - key: LILUVINE_WA_HMAC   # clé HMAC de l'émetteur « shuyahstore » (secret)
        sync: false
      - key: LILUVINE_WA_EMETTEUR
        value: shuyahstore
      - key: SMTP_HOST          # ex. smtp-relay.brevo.com (fournisseur au choix)
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM          # ex. ShuyahStore <ne-pas-repondre@votre-domaine>
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_VERIFIE_POUR_DEPOSER   # auto = exigée seulement si l'envoi d'e-mails est configuré ; oui / non pour forcer
        value: auto
      - key: APK_TAILLE_MAX_MO
        value: "150"

  # --------------------------------------------------------------------------
  # Site statique React (gratuit)
  # --------------------------------------------------------------------------
  - type: web
    name: shuyahstore-site
    domains:
      - shuyahstore.store
      - www.shuyahstore.store
    runtime: static
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Adresse de l'API : à corriger si Render ajoute un suffixe au nom du service (ex. shuyahstore-api-ab12.onrender.com)
      - key: VITE_API_BASE_URL
        value: https://api.shuyahstore.store/api
    # Toutes les adresses du site (ex. /app/com.exemple) renvoient la page unique de l'application
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
